AWSTemplateFormatVersion: "2010-09-09"
Description: "Session-Beacon Development Stack"

Parameters:
  Environment:
    Type: String
    Default: dev

Resources:
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "Session-Beacon-${Environment}-sessions"
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: source_session_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: source_session_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "Session-Beacon-${Environment}"
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  SessionsTableName:
    Value: !Ref SessionsTable
